name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto nativo Android (expo prebuild)
        run: npx expo prebuild --platform android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug, sin firma release)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventario-app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Última build"
          prerelease: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
